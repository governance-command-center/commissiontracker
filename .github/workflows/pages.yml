name: Deploy frontend to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: commission-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package frontend only
        run: |
          mkdir -p pages-artifact
          cp index.html app.js cloud.js style.css engine.js baseline.js firebase-config.js xlsx.full.min.js pages-artifact/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-artifact
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
